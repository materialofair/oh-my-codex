    description: "Planner prompt should anchor outputs to .omcodex/plans."
    vars: {}
    assert:
      -
        type: "contains"
        value: ".omcodex/plans/"
  -
    description: "Planner prompt should avoid direct implementation."
    vars: {}
    assert:
      -
        type: "contains"
        value: "Never implement"
