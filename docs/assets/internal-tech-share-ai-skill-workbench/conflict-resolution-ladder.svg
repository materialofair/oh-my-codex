<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">多源 skill 冲突治理决策梯</title>
  <desc id="desc">展示同名或相似能力冲突时的决策顺序。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161f1f"/>
      <stop offset="1" stop-color="#2a261d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#82d5cc"/>
    </marker>
  </defs>

  <rect width="1440" height="820" fill="url(#bg)"/>
  <text x="88" y="84" fill="#fbf3e8" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="42" font-weight="800">冲突治理：名字一样，不代表应该自动覆盖</text>
  <text x="90" y="126" fill="#b8c4bf" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="22">多源能力合并时，真正要保护的是团队已经验证过的本地经验。</text>

  <g filter="url(#shadow)">
    <rect x="95" y="240" width="295" height="340" rx="24" fill="#2d2b25" stroke="#6c6250"/>
    <text x="138" y="300" fill="#f8f1e7" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="30" font-weight="800">冲突输入</text>
    <text x="135" y="365" fill="#e6d8bc" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="22">security-review</text>
    <text x="135" y="410" fill="#cfc3aa" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="19">local</text>
    <text x="135" y="452" fill="#e6d8bc" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="22">security-review</text>
    <text x="135" y="497" fill="#cfc3aa" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="19">upstream / ECC</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter, PingFang SC, Arial, sans-serif">
    <rect x="515" y="180" width="410" height="500" rx="28" fill="#20302f" stroke="#4f887f"/>
    <text x="588" y="242" fill="#f8f1e7" font-size="32" font-weight="800">决策顺序</text>

    <rect x="575" y="300" width="290" height="58" rx="14" fill="#2ab7a9"/>
    <text x="620" y="337" fill="#10201e" font-size="22" font-weight="800">1. 显式 preference</text>

    <rect x="575" y="382" width="290" height="58" rx="14" fill="#31423f" stroke="#638d85"/>
    <text x="635" y="419" fill="#eaf6f2" font-size="22" font-weight="700">2. quality score</text>

    <rect x="575" y="464" width="290" height="58" rx="14" fill="#31423f" stroke="#638d85"/>
    <text x="666" y="501" fill="#eaf6f2" font-size="22" font-weight="700">3. SemVer</text>

    <rect x="575" y="546" width="290" height="58" rx="14" fill="#31423f" stroke="#638d85"/>
    <text x="638" y="583" fill="#eaf6f2" font-size="22" font-weight="700">4. local priority</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1050" y="245" width="300" height="330" rx="24" fill="#1f2d2c" stroke="#55857c"/>
    <text x="1100" y="306" fill="#f8f1e7" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="30" font-weight="800">合并结果</text>
    <text x="1090" y="370" fill="#d8eee8" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="22">进入运行时的是</text>
    <text x="1090" y="412" fill="#8bd8cf" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="26" font-weight="800">被解释过的选择</text>
    <text x="1090" y="472" fill="#c4d4cf" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="19">而不是“最新版本”</text>
    <text x="1090" y="505" fill="#c4d4cf" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="19">或“上游默认值”。</text>
  </g>

  <path d="M390 410 C455 410 455 410 515 410" fill="none" stroke="#82d5cc" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M925 410 C990 410 990 410 1050 410" fill="none" stroke="#82d5cc" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="390" y="700" width="660" height="52" rx="18" fill="#2b302d" stroke="#5c6863"/>
  <text x="435" y="734" fill="#d9e7e2" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="21">本地版本号不高，也可能更符合当前团队的代码风格和验证边界。</text>
</svg>
