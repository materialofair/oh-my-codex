<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
  <title id="title">local-first 多源工作台架构</title>
  <desc id="desc">展示本地经验、上游来源、筛选治理、冲突合并和运行时安装之间的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16201f"/>
      <stop offset="0.56" stop-color="#202321"/>
      <stop offset="1" stop-color="#111616"/>
    </linearGradient>
    <linearGradient id="local" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ab7a9"/>
      <stop offset="1" stop-color="#7ed7b7"/>
    </linearGradient>
    <linearGradient id="upstream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2a84c"/>
      <stop offset="1" stop-color="#f1cc7a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#83d7cf"/>
    </marker>
  </defs>

  <rect width="1440" height="840" fill="url(#bg)"/>
  <g opacity="0.22" stroke="#dce8e4" stroke-width="1">
    <path d="M120 165H1320M120 310H1320M120 455H1320M120 600H1320M280 110V710M520 110V710M760 110V710M1000 110V710M1240 110V710"/>
  </g>

  <text x="96" y="84" fill="#f6f0e4" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="42" font-weight="700">Local-first 工作台：上游是输入，本地经验是控制面</text>
  <text x="98" y="126" fill="#aebdb7" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="22">让 skills / agents / commands / MCP 先被选择、解释、合并，再进入具体运行时。</text>

  <g filter="url(#shadow)">
    <rect x="80" y="205" width="300" height="245" rx="18" fill="#23302f" stroke="#426b64"/>
    <rect x="104" y="229" width="252" height="52" rx="12" fill="url(#local)"/>
    <text x="130" y="263" fill="#10201e" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="26" font-weight="800">Local source</text>
    <text x="116" y="324" fill="#f6f0e4" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="24" font-weight="700">本地经验优先</text>
    <text x="116" y="365" fill="#bdcbc5" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="18">团队沉淀的工作流、验证习惯、</text>
    <text x="116" y="395" fill="#bdcbc5" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="18">代码风格和运行时边界。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="500" width="300" height="220" rx="18" fill="#2f2b21" stroke="#806b36"/>
    <rect x="104" y="524" width="252" height="52" rx="12" fill="url(#upstream)"/>
    <text x="130" y="558" fill="#251b08" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="26" font-weight="800">Upstream</text>
    <text x="116" y="619" fill="#f6f0e4" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="24" font-weight="700">可吸收的外部能力</text>
    <text x="116" y="660" fill="#d3c7ab" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="18">oh-my / superpowers / ECC</text>
    <text x="116" y="690" fill="#d3c7ab" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="18">提供默认能力，但不直接接管。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="480" y="270" width="255" height="300" rx="24" fill="#202a2b" stroke="#4c837c"/>
    <text x="520" y="322" fill="#f6f0e4" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="28" font-weight="800">Curation</text>
    <text x="520" y="358" fill="#9fd8cf" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="20">allowlist / profile</text>
    <line x1="520" y1="392" x2="695" y2="392" stroke="#446b66"/>
    <text x="520" y="436" fill="#cbd8d3" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="20">选择进入运行时的能力</text>
    <text x="520" y="474" fill="#cbd8d3" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="20">记录来源 manifest</text>
    <text x="520" y="512" fill="#cbd8d3" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="20">过滤噪音和重复项</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="825" y="250" width="285" height="340" rx="24" fill="#1f2727" stroke="#56746e"/>
    <text x="868" y="312" fill="#f6f0e4" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="30" font-weight="800">Merge + Resolve</text>
    <text x="868" y="351" fill="#9fd8cf" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="20">同名 / 相似 / intent 冲突</text>
    <g fill="#263635" stroke="#496e68">
      <rect x="864" y="396" width="204" height="42" rx="10"/>
      <rect x="864" y="456" width="204" height="42" rx="10"/>
      <rect x="864" y="516" width="204" height="42" rx="10"/>
    </g>
    <text x="889" y="424" fill="#e9f5f0" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="19">local priority</text>
    <text x="889" y="484" fill="#e9f5f0" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="19">quality / SemVer</text>
    <text x="889" y="544" fill="#e9f5f0" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="19">source priority</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1190" y="205" width="170" height="210" rx="22" fill="#1f2c2c" stroke="#4d847a"/>
    <text x="1224" y="264" fill="#f6f0e4" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="25" font-weight="800">Claude</text>
    <text x="1215" y="306" fill="#b9cbc5" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="18">skills</text>
    <text x="1215" y="337" fill="#b9cbc5" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="18">agents</text>
    <text x="1215" y="368" fill="#b9cbc5" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="18">hooks / commands</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1190" y="505" width="170" height="210" rx="22" fill="#1f2c2c" stroke="#4d847a"/>
    <text x="1228" y="564" fill="#f6f0e4" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="25" font-weight="800">Codex</text>
    <text x="1215" y="606" fill="#b9cbc5" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="18">skills</text>
    <text x="1215" y="637" fill="#b9cbc5" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="18">AGENTS.md</text>
    <text x="1215" y="668" fill="#b9cbc5" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="18">MCP / config</text>
  </g>

  <path d="M380 328 C425 328 432 360 480 390" fill="none" stroke="#83d7cf" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M380 610 C425 610 430 530 480 490" fill="none" stroke="#d8b760" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M735 420 C780 420 785 420 825 420" fill="none" stroke="#83d7cf" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1110 400 C1150 360 1156 310 1190 310" fill="none" stroke="#83d7cf" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1110 470 C1150 520 1156 610 1190 610" fill="none" stroke="#83d7cf" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="500" y="760" fill="#9fb1ab" font-family="Inter, PingFang SC, Arial, sans-serif" font-size="20">核心判断：同步不是安装，安装之前必须先经过选择、解释和冲突治理。</text>
</svg>
